name: current-season-ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"
    - cron: "0 14 * * 4"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run current-season ingestion
        run: |
          python scripts/current_season_pipeline.py --append --full-refresh

      - name: Commit updated raw and master tables
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: refresh current-season ingestion outputs"
            git push
          fi

