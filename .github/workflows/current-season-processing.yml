name: current-season-processing

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["current-season-ingestion"]
    types:
      - completed

permissions:
  contents: write

jobs:
  process:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run current-season processing
        run: |
          python scripts/process_current_season_pipeline.py

      - name: Commit refreshed processed and BI outputs
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: refresh current-season processed outputs"
            git push
          fi

